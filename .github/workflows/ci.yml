name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Dry-run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dry-run pytest
        env:
          EVAL_DRY_RUN: "1"
        run: python -m pytest -q
