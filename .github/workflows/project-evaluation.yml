name: Project evaluation

on:
  workflow_dispatch:
    inputs:
      evaluation_id:
        description: UUID of the existing Neon evaluation_runs row
        required: true
        type: string
      submission_url:
        description: Google Drive file link (https://drive.google.com/file/d/FILE_ID/view)
        required: true
        type: string
      project_id:
        description: Pack id (for example word_counter)
        required: true
        type: string

concurrency:
  group: project-evaluation-${{ inputs.evaluation_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Instructor unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack_ok: ${{ steps.validate.outputs.pack_ok }}
      pack_error: ${{ steps.validate.outputs.pack_error }}
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - name: Checkout evaluation repo (trusted packs)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project pack
        id: validate
        run: |
          set -euo pipefail
          PROJECT="${{ inputs.project_id }}"
          if [[ ! -f "packs/${PROJECT}/manifest.yaml" ]]; then
            echo "pack_ok=false" >> "$GITHUB_OUTPUT"
            echo "pack_error=Unknown project pack: ${PROJECT}" >> "$GITHUB_OUTPUT"
            echo "Unknown project pack: ${PROJECT}"
            exit 0
          fi
          echo "pack_ok=true" >> "$GITHUB_OUTPUT"
          echo "pack_error=" >> "$GITHUB_OUTPUT"

      - name: Download and extract submission zip
        id: stage
        if: steps.validate.outputs.pack_ok == 'true'
        env:
          SUBMISSION_URL: ${{ inputs.submission_url }}
          PROJECT: ${{ inputs.project_id }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          project = os.environ["PROJECT"]
          if not project or any(c not in "abcdefghijklmnopqrstuvwxyz0123456789_-" for c in project):
              sys.exit("project_id must be a pack slug")
          PY

          python scripts/download_drive_file.py "$SUBMISSION_URL" submission.zip
          python - <<'PY'
          import sys
          magic = open("submission.zip", "rb").read(2)
          if magic != b"PK":
              sys.exit("Drive did not return a zip.")
          PY

          python scripts/extract_submission_zip.py submission.zip submission-src

          mapfile -t PATHS < <(python scripts/list_submission_paths.py "${PROJECT}")
          if [[ ${#PATHS[@]} -eq 0 ]]; then
            echo "manifest has no submission_paths" >&2
            exit 1
          fi
          for rel in "${PATHS[@]}"; do
            src="submission-src/${rel}"
            dest="packs/${PROJECT}/submission/${rel}"
            if [[ ! -f "${src}" ]]; then
              echo "Missing submission file: ${rel}" >&2
              exit 1
            fi
            mkdir -p "$(dirname "${dest}")"
            cp "${src}" "${dest}"
            echo "Staged ${rel}"
          done

          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Upload extracted submission
        if: steps.stage.outputs.staged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: submission-${{ inputs.evaluation_id }}
          path: submission-src
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Run instructor pytest (no secrets)
        id: pytest
        if: steps.stage.outputs.staged == 'true'
        working-directory: ${{ github.workspace }}
        env:
          # Explicitly clear secrets so learner code cannot see them.
          OPENAI_API_KEY: ""
          DATABASE_URL: ""
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          SUBMISSION_TOKEN: ""
          GOOGLE_SERVICE_ACCOUNT_JSON: ""
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          python -m pytest "packs/${{ inputs.project_id }}/tests" -q \
            --junitxml=artifacts/junit.xml
          status=$?
          set -e
          echo "pytest_exit=${status}" >> "$GITHUB_OUTPUT"
          # Failures must not skip the graph; JUnit is the handoff.
          exit 0

      - name: Upload JUnit artifact
        if: always() && steps.validate.outputs.pack_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.evaluation_id }}
          path: artifacts/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Fail job when pack is unknown
        if: steps.validate.outputs.pack_ok != 'true'
        run: |
          echo "${{ steps.validate.outputs.pack_error }}" >&2
          exit 1

  evaluate:
    name: LangGraph evaluation
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Repo variable: Settings → Secrets and variables → Actions → Variables.
      # Set EVAL_DRY_RUN=true to use the fake model (no OPENAI_API_KEY required).
      EVAL_DRY_RUN: ${{ vars.EVAL_DRY_RUN }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVALUATION_ID: ${{ inputs.evaluation_id }}
      PROJECT_ID: ${{ inputs.project_id }}
    steps:
      - name: Require evaluation_id
        run: |
          set -euo pipefail
          if [[ -z "${EVALUATION_ID}" ]]; then
            echo "evaluation_id is required" >&2
            exit 1
          fi

      - name: Checkout evaluation repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fail on unknown pack
        if: needs.test.outputs.pack_ok != 'true'
        run: |
          set -euo pipefail
          echo "${{ needs.test.outputs.pack_error || 'Unknown project pack' }}" >&2
          python -m evaluator \
            --evaluation-id "${EVALUATION_ID}" \
            --project-id "${PROJECT_ID:-unknown}" \
            --run-url "${GITHUB_RUN_URL}" \
            --mark-error "${{ needs.test.outputs.pack_error || 'Unknown project pack' }}"
          exit 1

      - name: Fail when the zip was not extracted
        if: needs.test.outputs.pack_ok == 'true' && needs.test.outputs.staged != 'true'
        run: |
          echo "The submission zip was not extracted. See the test job log." >&2
          exit 1

      - name: Download extracted submission
        if: needs.test.outputs.staged == 'true'
        uses: actions/download-artifact@v4
        with:
          name: submission-${{ inputs.evaluation_id }}

      - name: Download JUnit artifact
        if: needs.test.outputs.staged == 'true'
        uses: actions/download-artifact@v4
        with:
          name: junit-${{ inputs.evaluation_id }}
          path: artifacts
        continue-on-error: true

      - name: Require OpenAI key for live evaluation
        if: needs.test.outputs.staged == 'true'
        run: |
          set -euo pipefail
          dry="$(echo "${EVAL_DRY_RUN:-}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${dry}" == "1" || "${dry}" == "true" || "${dry}" == "yes" ]]; then
            echo "EVAL_DRY_RUN=${EVAL_DRY_RUN}: using fake model (OPENAI_API_KEY not required)"
            exit 0
          fi
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "OPENAI_API_KEY secret is required for live evaluation (or set variable EVAL_DRY_RUN=true)" >&2
            exit 1
          fi

      - name: Run LangGraph evaluator
        if: needs.test.outputs.staged == 'true'
        run: |
          set -euo pipefail
          JUNIT_ARGS=()
          if [[ -f artifacts/junit.xml ]]; then
            JUNIT_ARGS=(--junit artifacts/junit.xml)
          fi
          DRY_ARGS=()
          dry="$(echo "${EVAL_DRY_RUN:-}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${dry}" == "1" || "${dry}" == "true" || "${dry}" == "yes" ]]; then
            DRY_ARGS=(--dry-run)
            echo "Injecting --dry-run (EVAL_DRY_RUN=${EVAL_DRY_RUN})"
          fi
          # There is no submission pull request. The zip on Drive is the source.
          python -m evaluator \
            --evaluation-id "${EVALUATION_ID}" \
            --project-id "${PROJECT_ID}" \
            --submission-dir submission-src \
            --skip-github \
            --run-url "${GITHUB_RUN_URL}" \
            "${JUNIT_ARGS[@]}" \
            "${DRY_ARGS[@]}"
